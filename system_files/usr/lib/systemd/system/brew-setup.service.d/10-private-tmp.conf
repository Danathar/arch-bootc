# Give the brew payload's first-boot unit its own /tmp.
#
# `brew-setup.service` arrives with `COPY --from=ghcr.io/ublue-os/brew … /system_files /`,
# so this repository neither writes it nor can review it at the digest a future Renovate
# bump lands. What it does at the digest the Containerfile pins today is stage a 154MB
# tarball through one fixed path, as root:
#
#   ExecStart=/usr/bin/mkdir -p /tmp/homebrew
#   ExecStart=/usr/bin/tar --zstd -xf /usr/share/homebrew.tar.zst -C /tmp/homebrew
#   ExecStart=/usr/bin/cp -R -n /tmp/homebrew/home/linuxbrew/.linuxbrew /home/linuxbrew
#   ExecStart=/usr/bin/chown -R 1000:1000 /home/linuxbrew
#
# On a booted system /tmp is world-writable, and `mkdir -p` exits 0 on an existing
# symlink rather than replacing it. An account that creates /tmp/homebrew first therefore
# has root extract through its symlink, has whatever extra files it left in that
# directory copied into /home/linuxbrew, and has them handed to UID 1000 by the chown.
# That prefix is what brew-update.timer runs as `User=1000` ten minutes after boot, and
# what /etc/profile.d/homebrew.sh puts on its owner's PATH — and the ownership guard in
# that fragment cannot help here, because after the chown the planted files really are
# owned by the user whose shell it is. docs/first-boot.md creates UID 1000 with
# `-G wheel`, so code running as that account reaches root through sudo.
#
# PrivateTmp gives this unit a private /tmp and /var/tmp, shared by every ExecStart= of
# one invocation and by no other process on the system, so the staging path stops being
# a name another account can claim. The copy destination (/home/linuxbrew) is outside
# both, so the payload still lands where it should.
#
# This is a drop-in rather than a replacement unit on purpose: restating upstream's
# ExecStart= chain here would go stale the first time the pinned digest moves, silently
# and behind a green build. The Containerfile checks, right after the COPY, that the
# unit that actually landed still stages where PrivateTmp= reaches.
[Service]
PrivateTmp=yes
