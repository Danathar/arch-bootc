name: Agent audit trail

# Reads back the record every agent-written pull request is supposed to leave,
# and fails when one did not leave it.
#
# The record is GitHub itself: a pull request the Hive app opens carries a
# `— hive:` signature line at the bottom of its description (backend, model,
# and the agent that wrote it), and every commit carries a Signed-off-by
# trailer. Nothing checked either after the merge. The DCO app is not a
# required check in the `main` ruleset, and an omp-backed run pushes under the
# maintainer's own login, so the author alone cannot say which merged pull
# requests an agent wrote -- the signature line is the provenance there, and
# this is what notices when it is missing.
#
# The job lists every pull request merged in the window, keeps the ones an
# agent wrote (opened by the Hive app, or carrying the signature line), and
# writes one row per pull request to the run summary: when it merged, who
# opened and who merged it, which agent, backend and model, how many commits,
# how many are signed off, and any T3 path it touched (docs/risk-tiers.md).
# Two things fail the run: a Hive-app pull request with no signature line, and
# a commit with no Signed-off-by trailer (merge commits made by updating a
# branch are exempt, as the DCO app exempts them). A T3 path is reported, not
# failed: an agent may touch one behind review, and the row tells a reader
# where to look first.
#
# This is a check, not a metric. The metrics page keeps its numbers off a
# schedule on purpose; this runs on one because its output is red or green and
# a missing provenance line is a gap to close, not a trend to watch. Dropping
# the `schedule:` trigger and keeping `workflow_dispatch` is a three-line
# change. The job never writes: the token reads pull requests and nothing
# else, and there is nothing to check out, so no action runs at all.
on:
  schedule:
    - cron: "23 5 1 * *" # monthly, the 1st at 05:23 UTC, covering the previous 31 days
  workflow_dispatch:
    inputs:
      since:
        description: Audit pull requests merged on or after this date (YYYY-MM-DD). Blank means the last 31 days.
        required: false
        default: ""

jobs:
  audit:
    name: Read back the record of every merged agent pull request
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Audit merged agent pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail

          if [ -z "$SINCE" ]; then
            SINCE="$(date -u -d '31 days ago' +%F)"
          fi
          case "$SINCE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "::error::since must be YYYY-MM-DD, got '$SINCE'"
              exit 2
              ;;
          esac
          if [ "$(date -u -d "$SINCE" +%F 2>/dev/null)" != "$SINCE" ]; then
            echo "::error::since must be a real date, got '$SINCE'"
            exit 2
          fi

          # `gh pr list` returns the newest N and says nothing about the rest,
          # so a window that fills the cap is refused rather than audited in
          # part.
          limit=500
          gh pr list --repo "$REPO" --state merged --limit "$limit" \
            --search "merged:>=$SINCE" \
            --json number,title,author,mergedAt,mergedBy,body,url > merged.json
          total="$(jq length merged.json)"
          if [ "$total" -ge "$limit" ]; then
            echo "::error::$total pull requests merged since $SINCE reached the $limit cap; audit a narrower window"
            exit 2
          fi

          # An agent pull request is one the Hive app opened, or one whose body
          # carries the signature line; the second clause is what catches the
          # runs that push under the maintainer's own login. Renovate is a bot
          # too, so the app is matched by its login, not by is_bot.
          jq -c '[.[] | select(.author.login == "app/danathar-atomic-hive" or ((.body // "") | test("(^|\n)— hive:")))]' \
            merged.json > agents.json

          # Commits and files are fetched one pull request at a time: asking
          # `gh pr list` for them alongside the list trips GitHub's GraphQL
          # node ceiling on any window this repository fills in a few weeks.
          jq -r '.[].number' agents.json | while read -r number; do
            gh pr view "$number" --repo "$REPO" --json number,commits,files,changedFiles
          done | jq -s 'map({(.number | tostring): .}) | add // {}' > details.json

          # `gh pr view` returns at most 100 commits and 100 files. A pull
          # request past either would be audited in part and read as clean, so
          # it is refused like a window past the cap.
          partial="$(jq -r 'to_entries[] | select((.value.files | length) < .value.changedFiles or (.value.commits | length) >= 100) | "#\(.key)"' details.json | paste -sd, -)"
          if [ -n "$partial" ]; then
            echo "::error::$partial list fewer commits or files than the pull request holds (the API returns at most 100 of each); audit it by hand"
            exit 2
          fi

          # A merge commit is exempt from the trailer rule, as the DCO app
          # exempts it, and the only honest test is its parent count. `gh pr
          # view` does not return parents, so they are read for each commit
          # that lacks a trailer and no other.
          jq -r '.[].commits[] | select(.messageBody | test("(^|\n)Signed-off-by: ") | not) | .oid' details.json | sort -u |
            while read -r oid; do
              printf '%s %s\n' "$oid" "$(gh api "repos/$REPO/commits/$oid" --jq '.parents | length')"
            done | jq -Rn '[inputs | split(" ") | {(.[0]): (.[1] | tonumber)}] | add // {}' > parents.json

          jq --arg since "$SINCE" --arg total "$total" --slurpfile details details.json --slurpfile parents parents.json '
            def signature: (.body // "") | split("\n") | map(select(startswith("— hive:"))) | first;
            def field($key): ((. // "") | capture("(^|\\s)\($key)=(?<v>\\S+)") | .v) // null;
            # The T3 paths docs/risk-tiers.md names that exist in the tree: a
            # trailing slash is a directory prefix, anything else an exact
            # path. tests/test-agent-audit.sh joins this list to that section.
            def t3paths: [
              "brew-payload.manifest",
              "cosign.pub",
              "system_files/etc/containers/policy.json",
              "system_files/etc/containers/registries.d/",
              "scripts/quickstart.sh",
              "scripts/prune-package-versions.sh",
              ".github/rulesets/",
              ".github/policies/workflow-permissions.json",
              ".claude/settings.json",
              ".claude/hooks/",
              ".claude/skills/",
              ".cursor/rules/arch-bootc-safety.mdc"
            ];
            # Files that are T3 only by what changes in them (the root-login
            # model and bootc provenance live in the Containerfile, the publish
            # and sign jobs in build.yml). A path cannot say which hunk, so
            # they are reported as such rather than as T3.
            def t3content: ["Containerfile", ".github/workflows/build.yml"];
            def t3: . as $p | any(t3paths[]; . as $t | if endswith("/") then ($p | startswith($t)) else $p == $t end)
              or ($p | test("^system_files/usr/lib/systemd/system/[^/]+\\.wants/"));
            # A merge commit is one with more than one parent. `gh pr view` does
            # not return parents, so they were read above for each commit that
            # lacks a trailer; a commit not in that map has a trailer and is
            # not asked about.
            def ismerge: ($parents[0][.oid] // 1) > 1;
            def row:
              . as $pr
              | ($details[0][$pr.number | tostring]) as $d
              | if $d == null then error("no commits or files fetched for #\($pr.number)") else . end
              | (signature) as $sig
              | {
                  number: $pr.number,
                  url: $pr.url,
                  title: $pr.title,
                  merged: $pr.mergedAt[:10],
                  author: $pr.author.login,
                  merged_by: ($pr.mergedBy.login // "unknown"),
                  hive_app: ($pr.author.login == "app/danathar-atomic-hive"),
                  signature: $sig,
                  agent: ($sig | field("agent")),
                  backend: ($sig | field("backend")),
                  model: ($sig | field("model")),
                  commits: ($d.commits | length),
                  signed_n: ([$d.commits[] | select(.messageBody | test("(^|\n)Signed-off-by: "))] | length),
                  unsigned: [$d.commits[]
                    | select(ismerge | not)
                    | select(.messageBody | test("(^|\n)Signed-off-by: ") | not)
                    | .oid[:7]],
                  merges: [$d.commits[] | select(ismerge)] | length,
                  t3: [$d.files[].path | select(t3)],
                  t3content: [$d.files[].path | select(IN(t3content[]))]
                };
            def findings:
              [ .[]
                | (if .hive_app and .signature == null then "#\(.number): opened by the Hive app with no `— hive:` signature line, so the backend and model that wrote it are unrecorded" else empty end),
                  (if (.unsigned | length) > 0 then "#\(.number): commit\(if (.unsigned | length) > 1 then "s" else "" end) \(.unsigned | join(", ")) carr\(if (.unsigned | length) > 1 then "y" else "ies" end) no Signed-off-by trailer" else empty end)
              ];
            def cell: tostring | gsub("\\|"; "\\|");
            def who:
              if .signature == null then "**no signature**"
              else "\(.backend // "?") / \(.model // "no model") (\(.agent // "no agent"))" end;
            def paths:
              [ (.t3[] | "`\(.)`"), (.t3content[] | "`\(.)` (T3 by content)") ]
              | if length == 0 then "none" else join(", ") end;
            def signed:
              if (.unsigned | length) == 0 and .merges == 0 then "all"
              elif (.unsigned | length) == 0 then "\(.signed_n) of \(.commits) (merges exempt)"
              else "**\(.signed_n) of \(.commits)**" end;
            map(row)
            | . as $rows
            | {
                findings: ($rows | findings),
                report: (
                  [ "### Agent audit trail: pull requests merged since \($since)",
                    "",
                    "\($rows | length) of the \($total) pull requests merged in the window were written by an agent.",
                    ""
                  ]
                  + (if ($rows | length) == 0 then [] else
                      [ "| PR | Merged | Author | Merged by | Backend / model (agent) | Commits | Signed-off | T3 paths |",
                        "| --- | --- | --- | --- | --- | --- | --- | --- |" ]
                      + [ $rows[]
                          | "| [#\(.number)](\(.url)) \(.title | cell) | \(.merged) | \(.author) | \(.merged_by) | \(who | cell) | \(.commits) | \(signed) | \(paths) |" ]
                    end)
                  + [ "" ]
                  + (if ($rows | findings | length) == 0
                      then [ "Every Hive-app pull request carries its signature line and every non-merge commit its Signed-off-by trailer."
                             + (([$rows[].merges] | add) as $m | if $m > 0 then " \($m) merge commit(s) without a trailer were exempt." else "" end) ]
                      else [ "#### Findings", "" ] + ($rows | findings | map("- " + .))
                    end)
                  | join("\n")
                )
              }' agents.json > result.json

          jq -r .report result.json | tee -a "$GITHUB_STEP_SUMMARY"
          findings="$(jq '.findings | length' result.json)"
          if [ "$findings" -gt 0 ]; then
            echo "::error::$findings agent pull request(s) merged since $SINCE left an incomplete record; see the run summary"
            exit 1
          fi
