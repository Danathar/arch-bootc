---
name: Build container image
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "05 10 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  IMAGE_DESC: "Experimental arch-bootc POC image"
  IMAGE_KEYWORDS: "bootc,archlinux,arch"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/230667510?s=400&u=cb912a5db49aee164a609a0fb4967d2d8170feb9&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  CHUNKAH_IMAGE: "quay.io/coreos/chunkah:v0.6.0"
  SHELLCHECK_IMAGE: "docker.io/koalaman/shellcheck:v0.11.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    # Without an explicit cap, a hung step runs until GitHub's 360-minute
    # runner default kills it, holding this workflow's concurrency group for
    # the whole time. Every job below therefore sets one, sized to its
    # observed runtime plus headroom, so a hang fails fast instead of
    # quietly burning most of a day.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo docker run --rm -v "${PWD}:/mnt:ro" \
            "${SHELLCHECK_IMAGE}" \
            /mnt/system_files/usr/libexec/arch-bootc-prune-esp \
            /mnt/system_files/usr/bin/ostree-pkg-diff \
            /mnt/scripts/quickstart.sh \
            /mnt/scripts/pr-review-state.sh \
            /mnt/tests/run-tests.sh \
            /mnt/tests/check-coverage.sh \
            /mnt/tests/check-invariants.sh \
            /mnt/tests/tune-coverage.sh \
            /mnt/tests/test-prune-esp.sh \
            /mnt/tests/test-ostree-pkg-diff.sh \
            /mnt/tests/test-ostree-pkg-diff-db.sh \
            /mnt/tests/test-pr-review-state.sh \
            /mnt/tests/test-quickstart-baremetal.sh \
            /mnt/tests/e2e/test-quickstart-dry-run.sh
          # homebrew.sh is sourced by /etc/profile.d, not executed directly, so
          # it has no shebang for shellcheck to read -- hence the separate
          # invocation with an explicit --shell, matching the Justfile's `lint`
          # recipe. It was linted there but not here until
          # tests/check-invariants.sh compared the two lists and found the gap.
          sudo docker run --rm -v "${PWD}:/mnt:ro" \
            "${SHELLCHECK_IMAGE}" --shell=bash \
            /mnt/system_files/etc/profile.d/homebrew.sh

  test:
    name: Shell tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Plain bash, no root, no container runtime, no network -- so this needs
      # nothing beyond the checkout and finishes long before the build would.
      - name: Run shell tests and enforce coverage floors
        run: ./tests/check-coverage.sh

      # Static assertions over the checked-out tree that the security
      # invariants AGENTS.md calls load-bearing are still where they are
      # supposed to be. A build proves the image builds; an image that has
      # quietly lost `pam_wheel.so use_uid` builds perfectly well.
      - name: Assert repository invariants
        run: ./tests/check-invariants.sh

  build_push:
    name: Build and push image
    needs: [lint, test]
    runs-on: ubuntu-24.04
    # Green runs on main have landed between roughly 12 and 50 minutes,
    # dominated by compiling bootc and by the rechunk step. 90 leaves room
    # for a slow runner or a cold layer cache while still catching a real
    # hang well before the 360-minute default would.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, kde, xfce]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}-${{ matrix.flavor }}"
          } >> "${GITHUB_ENV}"
          # Shared buildah layer-cache repo. All 3 flavors share the same
          # base-core stage and buildah's --cache-from/--cache-to key cache
          # entries by content digest (not by this repo path), so one shared
          # repo lets any flavor's cache push benefit the other two instead
          # of each flavor keeping its own separate, less-populated cache.
          echo "CACHE_IMAGE=${IMAGE_REGISTRY,,}/buildcache" >> "${GITHUB_ENV}"

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          # Passed to the Containerfile as PACMAN_CACHE_BUST (see there for why):
          # forces the remote buildah layer cache to miss once per calendar day
          # for the package-install step onward, instead of silently reusing a
          # cached `pacman -Syu` result against Arch's live, ever-changing repos.
          echo "ymd=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - name: Log in to GHCR for the build cache and image signing
        # buildah resolves registry credentials in this order: REGISTRY_AUTH_FILE,
        # $XDG_RUNTIME_DIR/containers/auth.json, ~/.config/containers/auth.json,
        # then ~/.docker/config.json (containers-auth.json(5)) -- so writing this
        # file makes credentials available to the --cache-from/--cache-to flags
        # used by the Build Image step below, and later to cosign when signing.
        # `docker login` itself times out talking to ghcr.io on this runner, so
        # the file is written directly instead of shelling out to it.
        #
        # Skipped only for fork PRs: a fork's GITHUB_TOKEN is downgraded to
        # read-only by GitHub regardless of the `packages: write` permission
        # requested above, and these packages are private, so a fork PR would
        # get a credential that can't authenticate anyway. That's fine --
        # --cache-from below is passed unconditionally and degrades gracefully
        # to a cache miss without credentials.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          registry_host="${IMAGE_REGISTRY%%/*}"
          auth="$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 -w0)"
          mkdir -p "${HOME}/.docker"
          touch "${HOME}/.docker/config.json"
          chmod 600 "${HOME}/.docker/config.json"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${registry_host}" "${auth}" \
            > "${HOME}/.docker/config.json"

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          # layers=true is required for --cache-from/--cache-to to do anything
          # at all (buildah only consults the cache when building in layered
          # mode). This is a real behavior change from the previous
          # layers-less default: without --layers, buildah keeps zero
          # intermediate images; with --layers, every RUN step is committed as
          # its own image and kept in local storage until pruned. See the
          # "Prune buildah build cache" step below, which cleans these up
          # right after this step and the cache-to push use them.
          layers: "true"
          extra-args: |
            --target ${{ matrix.flavor }}
            --cache-from ${{ env.CACHE_IMAGE }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Tag files with their pacman package (CHUNK_TAG=1) only when we will
          # publish, so PR builds skip the cost. Consumed by the rechunk step.
          build-args: |
            CHUNK_TAG=${{ (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '1' || '0' }}
            PACMAN_CACHE_BUST=${{ steps.date.outputs.ymd }}
          oci: true

      - name: Populate build cache
        # Refreshes the remote layer cache so the next run (next push to
        # main, tomorrow's schedule) can skip re-running the shared
        # base-core work (notably compiling bootc from source and re-running
        # dracut). This re-invocation hits the *local* layer cache the Build
        # Image step above just populated (same runner, same
        # containers-storage), so it does no rebuilding of its own; its only
        # real work is pushing any new or changed layer blobs to the cache
        # repo.
        #
        # continue-on-error is deliberate, not sloppy: buildah's --cache-to
        # makes the *entire* `buildah bud` process exit non-zero if the
        # cache push fails for any reason (auth, registry hiccup, ...), even
        # though the image had already committed successfully. Without
        # continue-on-error, a transient registry issue here would fail the
        # whole job even though the image built fine and was already tagged
        # by the step above. Restricted to non-PR pushes to the default
        # branch (same gate used for rechunk/push/sign below) so PR runs --
        # including same-repo, non-fork PRs -- never spend extra time
        # pushing cache blobs; they still benefit from --cache-from above.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          layers: "true"
          extra-args: |
            --target ${{ matrix.flavor }}
            --cache-from ${{ env.CACHE_IMAGE }}
            --cache-to ${{ env.CACHE_IMAGE }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            CHUNK_TAG=${{ (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '1' || '0' }}
            PACMAN_CACHE_BUST=${{ steps.date.outputs.ymd }}
          oci: true

      - name: Prune buildah build cache
        # --layers keeps every per-instruction intermediate image in local
        # storage. Combined with this action's squash=true default, that
        # means the full set of per-step layers AND the final squashed copy
        # of the same content briefly coexist on disk. The remote cache was
        # already populated (if applicable) by the step above, so these
        # local intermediates are pure overhead by this point -- drop them
        # before the disk-hungry rechunk step runs. Unconditional (not just
        # on publish runs) since --layers is now always on and the local
        # intermediates appear on every run, including PR builds.
        run: |
          buildah rm --all || true
          buildah prune -f || true

      - name: Rechunk image with chunkah
        id: rechunk
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # Expansions are passed through `env:` rather than interpolated
        # directly into the script: a `${{ }}` inside a `run:` block is pasted
        # in as raw text before the shell ever sees it, so any quote or
        # metacharacter in the value would execute as code. Via `env:` the
        # value arrives as ordinary shell data instead.
        env:
          METADATA_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          FIRST_TAG="$(echo "${METADATA_TAGS}" | awk '{print $1}')"
          SRC="${IMAGE_NAME}:${FIRST_TAG}"
          CHUNKAH_WORK_DIR="${RUNNER_TEMP}/chunkah-${{ matrix.flavor }}"
          CHUNKAH_OCI_DIR="${CHUNKAH_WORK_DIR}/oci"
          rm -rf "${CHUNKAH_WORK_DIR}"
          mkdir -p "${CHUNKAH_WORK_DIR}"
          df -h

          # Drop build containers and dangling intermediate layers before
          # rechunking. Keep the final source image; chunkah still needs it.
          buildah rm --all || true
          buildah prune -f || true
          podman image prune -f || true
          df -h

          # chunkah reads the source rootfs (and the user.component xattrs set in
          # the Containerfile) and writes a compressed OCI layout directly to
          # disk. Avoiding `podman load` keeps the large rechunked KDE image out
          # of containers-storage and prevents GitHub-hosted runners from
          # running out of space while copying blobs.
          CHUNKAH_CONFIG_STR="$(podman inspect "${SRC}")"
          export CHUNKAH_CONFIG_STR
          podman pull -q "${CHUNKAH_IMAGE}"
          echo "::group::Rechunking ${SRC} into per-package layers"
          podman run --rm \
            --mount=type=image,src="${SRC}",dst=/chunkah \
            --mount=type=bind,src="${CHUNKAH_WORK_DIR}",dst=/out \
            -e CHUNKAH_CONFIG_STR \
            "${CHUNKAH_IMAGE}" \
            build -v --max-layers 96 --compressed \
              --output oci:/out/oci \
              -t "${IMAGE_NAME}:chunked"
          echo "::endgroup::"

          # The push step reads from the OCI layout directly with skopeo. Remove
          # the original buildah/podman images now so pushing has maximum free
          # space available.
          # Unquoted on purpose: sep-tags above makes this a space-separated
          # list and we want word splitting here.
          for tag in ${METADATA_TAGS}; do
            podman rmi "${IMAGE_NAME}:${tag}" || true
          done
          podman rmi "${CHUNKAH_IMAGE}" || true
          podman image prune -f || true
          df -h

          echo "CHUNKAH_OCI_DIR=${CHUNKAH_OCI_DIR}" >> "${GITHUB_ENV}"
          echo "Rechunked layer count: $(skopeo inspect --raw "oci:${CHUNKAH_OCI_DIR}:${IMAGE_NAME}:chunked" | jq '.layers | length')"

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          METADATA_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          command -v skopeo
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          SRC="oci:${CHUNKAH_OCI_DIR}:${IMAGE_NAME}:chunked"

          # GHCR's secondary rate limit ("wait a few minutes") outlasts
          # skopeo's own --retry-times backoff, so retry failed pushes with
          # longer sleeps in between.
          push_with_backoff() {
            local tag="$1"
            local delays=(60 120 240)
            local i

            for ((i = 0; i <= ${#delays[@]}; i++)); do
              if skopeo copy --retry-times 3 \
                --dest-creds "${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
                --digestfile "${RUNNER_TEMP}/push-digest" \
                "${SRC}" \
                "docker://${IMAGE_FULL}:${tag}"; then
                return 0
              fi
              if ((i < ${#delays[@]})); then
                echo "Push failed, retrying in ${delays[i]}s..."
                sleep "${delays[i]}"
              fi
            done
            return 1
          }

          # Unquoted on purpose, as in the rechunk step above.
          for tag in ${METADATA_TAGS}; do
            echo "::group::Pushing ${IMAGE_FULL}:${tag}"
            push_with_backoff "${tag}"
            echo "::endgroup::"
          done

          echo "digest=$(cat "${RUNNER_TEMP}/push-digest")" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # Pinned (and tracked separately by Renovate below) so the
          # installer action's own version can be updated independently of
          # the cosign CLI version. On v3+, the sign step below passes
          # --new-bundle-format=false --use-signing-config=false to keep
          # producing signatures older cosign clients can still verify.
          cosign-release: v3.1.3

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          # --new-bundle-format=false --use-signing-config=false keep the
          # signature in cosign v2's storage/format so older cosign clients
          # can still find and verify it (cosign v3 defaults to a new
          # bundle format stored as an OCI 1.1 referrer, which pre-v3
          # clients can't see).
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            "${IMAGE_FULL}@${PUSH_DIGEST}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}

  cleanup_packages:
    name: Clean up old package versions
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, kde, xfce]

    permissions:
      packages: write

    steps:
      - name: Prepare environment
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Lowercase to match the GHCR package names the build job creates
          # (GHCR package names are always lowercase; this repo's name
          # happens to already be lowercase, but keep this in sync with the
          # build job's own IMAGE_NAME handling above rather than assume it
          # always will be).
          echo "IMAGE_NAME=${REPO_NAME,,}" >> "${GITHUB_ENV}"

      # This workflow pushes `latest`, `latest.YYYYMMDD` and `YYYYMMDD` for
      # every one of the 3 flavors on every publish (daily via the schedule
      # trigger, plus every push to main), forever, with nothing removing
      # old versions. min-versions-to-keep keeps the N most-recently-created
      # versions of the package and deletes the rest; since a package's
      # `latest` tag is repointed to the newest version on every publish, the
      # version currently tagged `latest` is always among the most recent and
      # so is always kept -- no separate `ignore-versions` carve-out needed.
      #
      # NOTE: the default GITHUB_TOKEN's `packages: write` permission is
      # enough to *push* container images, but this action additionally
      # requires the package's own "Manage Actions access" setting (Package
      # settings on ghcr.io, not this repo's Settings) to grant this
      # repository the Admin role before GITHUB_TOKEN can *delete* versions.
      # Set that once per package (arch-bootc-base/-kde/-xfce) before this
      # job can succeed.
      - name: Delete old ${{ matrix.flavor }} package versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.IMAGE_NAME }}-${{ matrix.flavor }}
          package-type: container
          min-versions-to-keep: 30
