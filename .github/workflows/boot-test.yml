---
name: Boot test

# Boots each published flavor in a VM after every build of main and checks,
# over SSH, that it finished booting with NetworkManager and firewalld active,
# a login screen on the desktop flavors, and a working `bootc`.
#
# Every other check here reads the image as files. build.yml proves each
# flavor builds and passes `bootc container lint`, and nightly-compliance.yml
# that `:latest` is still signed; neither boots it. scripts/boot-test.sh does
# the work; this file only gives it a runner with KVM, a VM stack and disk
# space.
#
# It reports; it gates nothing. It runs after build.yml has already moved
# `:latest`, so a red run here means the boot test failed against the image a
# user would pull right now: the image, or the runner that could not boot it
# (docs/ai-ops-runbook.md says how to tell). auto-issues.yml turns a red run
# that a build of main started into an issue. Nothing is installed to a disk
# and nothing is upgraded: the VM boots the image as its root and goes away.

# `workflow_run` is the trigger zizmor and tests/check-invariants.sh call
# privileged, because it runs with this repository's token after a run that a
# pull request may have started. Here that run is only ever a build of main
# (the job's `if:` below), the job's token is `contents: read`, the checkout is
# the default branch (`workflow_run` always checks out the default branch, and
# no `ref:` is given), and nothing from the triggering run reaches a shell: the
# image is read from the registry by name, not from the run's artifacts.
#
# For the same reason no step writes GITHUB_ENV or GITHUB_PATH, which zizmor
# treats as dangerous under this trigger: bcvk is installed to /usr/local/bin
# and the boot step works out its own TMPDIR.
on: # zizmor: ignore[dangerous-triggers]
  # After build.yml finishes, not at a fixed time: a clock cannot know when a
  # slow build has moved `:latest`, and an image published after the clock
  # fired would go unbooted until the next day. build.yml runs on its own daily
  # schedule, so this still runs at least once a day.
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to boot. Its :latest is booted by digest."
        required: true
        type: choice
        options:
          - base
          - kde
          - xfce

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  boot:
    name: Boot ${{ matrix.flavor }}
    # Only builds of main, where `:latest` is published. A cancelled build was
    # replaced by a newer one, which starts its own boot test when it finishes.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-26.04
    # Host setup takes a few minutes, and each of the at most two boots is
    # bounded at fifteen minutes by BOOT_TIMEOUT_SECONDS in
    # scripts/boot-test.sh, so the cap covers two timed-out boots plus a slow
    # pull of a desktop flavor.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One flavor that does not boot must not stop the other two booting.
      fail-fast: false
      matrix:
        # Every flavor build.yml publishes, or the one a dispatch names.
        # tests/test-boot-test.sh fails when this list and build.yml's drift.
        flavor: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.flavor) || '["base","kde","xfce"]') }}
    env:
      WORK: ${{ github.workspace }}/artifacts/boot-test/${{ matrix.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bcvk's own CI host setup, run as its CI runs it. Without it virtiofsd
      # exits before any VM starts on this runner image ("Error entering
      # sandbox: DropSupplementalGroups ... Operation not permitted"). Pinned
      # by commit, bumped by hand, and run before anything else touches podman.
      - name: Prepare the host the way bcvk's CI does
        shell: bash
        env:
          BOOTC_ACTIONS_SHA: f77e18eca58220a5f8e82a115d65ee5973fcec83
          BOOTC_HOST_LIBVIRT: "true"
        run: |
          set -euo pipefail
          git clone -q https://github.com/bootc-dev/actions "${RUNNER_TEMP}/bootc-actions"
          git -C "${RUNNER_TEMP}/bootc-actions" checkout -q "${BOOTC_ACTIONS_SHA}"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/install-deps.sh"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/workarounds.sh"

      - name: Give the runner user KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # bcvk is a release binary, checked against the sha256 recorded here
      # before it runs. A new version is a reviewed edit of both lines.
      - name: Install the VM stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils virtiofsd skopeo
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bcvk.tar.gz" \
            https://github.com/bootc-dev/bcvk/releases/download/v0.19.0/bcvk-x86_64-unknown-linux-gnu.tar.gz
          echo "e6e3e2e8c13546d30481b035217442de78f2efe3e5a3bd3dbfb58d38345b4b98  ${RUNNER_TEMP}/bcvk.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/bcvk.tar.gz" -C "${RUNNER_TEMP}" bcvk-x86_64-unknown-linux-gnu
          sudo install -m 0755 "${RUNNER_TEMP}/bcvk-x86_64-unknown-linux-gnu" /usr/local/bin/bcvk
          bcvk --version

      # The desktop images are several GB compressed and more unpacked. The
      # root filesystem's free space varies between runners; /mnt, where it
      # exists, is the larger disk.
      - name: Put container storage on the larger disk
        shell: bash
        run: |
          set -euo pipefail
          df -h / /mnt 2>/dev/null || df -h /
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            sudo mkdir -p /mnt/containers /mnt/tmp
            sudo chown "$(id -u):$(id -g)" /mnt/containers /mnt/tmp
            mkdir -p "${HOME}/.config/containers"
            printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers/storage"\n' > "${HOME}/.config/containers/storage.conf"
          fi
          podman info --format '{{.Store.GraphRoot}}'

      # The image name is built the way nightly-compliance.yml's signatures
      # job builds it, lowercased because the registry refuses capitals.
      # Temporary files go to /mnt/tmp when the step above made it, for the
      # same reason the storage did.
      - name: Boot the image and run the checks
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.flavor }}:latest
        run: |
          if [ -d /mnt/tmp ] && [ -w /mnt/tmp ]; then export TMPDIR=/mnt/tmp; fi
          ./scripts/boot-test.sh --flavor "${FLAVOR}" --image "${IMAGE,,}" --work "${WORK}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test-${{ matrix.flavor }}-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/result.json
            ${{ env.WORK }}/summary.md
            ${{ env.WORK }}/checks/
            ${{ env.WORK }}/boot-*/
          if-no-files-found: ignore
          retention-days: 30
