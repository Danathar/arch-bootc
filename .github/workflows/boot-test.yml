---
name: Boot test

# Boots each published flavor in a VM after every build.yml run on main and
# checks, over SSH, that it finished booting with its network, firewall, login
# screen and bootc working.
#
# Every other check here reads the image as files. build.yml proves each flavor
# builds and passes `bootc container lint`, and nightly-compliance.yml that
# `:latest` is signed; neither starts it. scripts/boot-test.sh does the work;
# this file only gives it a runner with KVM, a VM stack and disk space.
#
# It reports; it gates nothing. It runs after build.yml has already moved
# `:latest`, so a red run here means the boot test failed against the image a
# user would pull right now: the image, or the runner that could not boot it
# (docs/ai-ops-runbook.md says how to tell). auto-issues.yml turns a red run
# into an issue.

on:
  # After build.yml finishes, not at a fixed time: a clock cannot know when a
  # slow build has pushed, and an image pushed after the clock fired would go
  # unbooted until the next day. build.yml runs on its own daily schedule, so
  # this runs at least once a day.
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to boot. all boots every flavor."
        required: false
        type: choice
        options:
          - all
          - base
          - kde
          - xfce
        default: all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  boot:
    name: Boot ${{ matrix.flavor }}
    # Only build.yml runs that publish: pushes, schedules and dispatches on
    # main. Its pull request runs build without pushing, so `:latest` did not
    # move. A cancelled build was replaced by a newer one, which starts its own
    # boot when it finishes. A failed build still boots: a flavor that failed
    # left the previous `:latest` in place, and that is what users pull.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled')
    # 26.04 ships podman 5 and a QEMU and virtiofsd new enough for bcvk.
    runs-on: ubuntu-26.04
    # Each of the at most two boots is bounded at fifteen minutes by
    # BOOT_TIMEOUT_SECONDS in scripts/boot-test.sh, so the cap covers two
    # timed-out boots plus host setup and a slow pull of the largest flavor.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON((inputs.flavor == '' || inputs.flavor == 'all') && '["base","kde","xfce"]' || format('["{0}"]', inputs.flavor)) }}
    env:
      WORK: ${{ github.workspace }}/boot-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bcvk's own CI host setup, run as its CI runs it. Without it virtiofsd
      # exits before any VM starts on this runner image ("Error entering
      # sandbox: DropSupplementalGroups ... Operation not permitted"), as
      # atomic-image-builder's variant boot test found. Pinned by commit and
      # run before anything else touches podman.
      - name: Prepare the host the way bcvk's CI does
        env:
          BOOTC_ACTIONS_SHA: f77e18eca58220a5f8e82a115d65ee5973fcec83
          BOOTC_HOST_LIBVIRT: "true"
        run: |
          set -euo pipefail
          git clone -q https://github.com/bootc-dev/actions "${RUNNER_TEMP}/bootc-actions"
          git -C "${RUNNER_TEMP}/bootc-actions" checkout -q "${BOOTC_ACTIONS_SHA}"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/install-deps.sh"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/workarounds.sh"

      - name: Give the runner user KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the VM stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils virtiofsd skopeo
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bcvk.tar.gz" \
            https://github.com/bootc-dev/bcvk/releases/download/v0.19.0/bcvk-x86_64-unknown-linux-gnu.tar.gz
          echo "e6e3e2e8c13546d30481b035217442de78f2efe3e5a3bd3dbfb58d38345b4b98  ${RUNNER_TEMP}/bcvk.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/bcvk.tar.gz" -C "${RUNNER_TEMP}/bin" bcvk-x86_64-unknown-linux-gnu
          mv "${RUNNER_TEMP}/bin/bcvk-x86_64-unknown-linux-gnu" "${RUNNER_TEMP}/bin/bcvk"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # kde is about 4 GB compressed and several times that unpacked. The root
      # filesystem's free space varies between runners; /mnt, where it exists,
      # is the larger disk.
      - name: Put container storage on the larger disk
        run: |
          set -euo pipefail
          df -h / /mnt 2>/dev/null || df -h /
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            sudo mkdir -p /mnt/containers /mnt/tmp
            sudo chown "$(id -u):$(id -g)" /mnt/containers /mnt/tmp
            mkdir -p "${HOME}/.config/containers"
            printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers/storage"\n' > "${HOME}/.config/containers/storage.conf"
            echo "TMPDIR=/mnt/tmp" >> "${GITHUB_ENV}"
          fi
          podman info --format '{{.Store.GraphRoot}}'

      - name: Boot the image and check it
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.flavor }}:latest
        run: ./scripts/boot-test.sh --image "${IMAGE,,}" --flavor "${FLAVOR}" --work "${WORK}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-test-${{ matrix.flavor }}-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/result.json
            ${{ env.WORK }}/checks/
            ${{ env.WORK }}/boot-*/
          if-no-files-found: ignore
          retention-days: 30
